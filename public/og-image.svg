<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4f46e5"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Grid pattern -->
  <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
    <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <!-- Logo circle -->
  <circle cx="600" cy="220" r="80" fill="rgba(255,255,255,0.15)"/>
  <circle cx="600" cy="220" r="60" fill="rgba(255,255,255,0.2)"/>
  <text x="600" y="237" font-size="50" text-anchor="middle" fill="white">📍</text>
  <!-- Title -->
  <text x="600" y="350" font-family="system-ui, -apple-system, sans-serif" font-size="56" font-weight="800" text-anchor="middle" fill="white">CivicResolve AI</text>
  <!-- Subtitle -->
  <text x="600" y="410" font-family="system-ui, -apple-system, sans-serif" font-size="26" text-anchor="middle" fill="rgba(255,255,255,0.8)">Intelligent Civic Issue Reporting &amp; Resolution</text>
  <!-- Tags -->
  <rect x="250" y="460" width="180" height="44" rx="22" fill="rgba(255,255,255,0.15)"/>
  <text x="340" y="487" font-family="system-ui" font-size="18" text-anchor="middle" fill="white">🤖 AI-Powered</text>
  <rect x="460" y="460" width="180" height="44" rx="22" fill="rgba(255,255,255,0.15)"/>
  <text x="550" y="487" font-family="system-ui" font-size="18" text-anchor="middle" fill="white">📊 Smart Routing</text>
  <rect x="670" y="460" width="200" height="44" rx="22" fill="rgba(255,255,255,0.15)"/>
  <text x="770" y="487" font-family="system-ui" font-size="18" text-anchor="middle" fill="white">🏙️ Civic Tech</text>
  <!-- Bottom note -->
  <text x="600" y="570" font-family="system-ui" font-size="18" text-anchor="middle" fill="rgba(255,255,255,0.5)">Hackathon MVP 2026 · Built with React + TypeScript + AI</text>
</svg>
